# filepath: render.yaml
services:
  - type: web
    name: nestquest-deploy # This should match your Render service name
    env: python
    buildFilter:
      paths:
        - "server/**"
        - "Login/**"
        - "requirements.txt"
        - "manage.py"
    buildCommand: |
      set -o errexit # Exit immediately if a command exits with a non-zero status.

      echo "Starting build process from repository root..."

      # Ensure Python version is what you expect, if not set globally for the service
      # python --version 

      echo "Installing Python dependencies from requirements.txt..."
      pip install -r requirements.txt

      echo "Collecting static files..."
      python manage.py collectstatic --noinput --clear

      echo "Applying database migrations..."
      python manage.py migrate --noinput

      # Conditionally create superuser
      echo "Checking CREATE_SUPERUSER variable: [$CREATE_SUPERUSER]" # Added for debugging
      if [[ "$CREATE_SUPERUSER" == "true" ]]; then
        echo "CREATE_SUPERUSER is 'true'. Attempting to create superuser..."
        python manage.py createsuperuser --no-input
        echo "Superuser creation command executed. IMPORTANT: Remember to set CREATE_SUPERUSER to false or remove it in the Render dashboard after this deploy."
      else
        echo "CREATE_SUPERUSER is not 'true' (actual value: [$CREATE_SUPERUSER]). Skipping superuser creation."
      fi

      echo "Build process completed."
    startCommand: "gunicorn server.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: server.settings
      - key: PYTHON_VERSION # Ensure this matches your project's needs
        value: "3.11"
      # Other envVars like DATABASE_URL, SECRET_KEY, GDAL paths should be set in Render Dashboard
      # For example:
      # - key: GDAL_LIBRARY_PATH
      #   value: "/usr/lib/libgdal.so" # If you're installing GDAL via apt-get in a Dockerfile or extended build
      # - key: GEOS_LIBRARY_PATH
      #   value: "/usr/lib/libgeos_c.so"
